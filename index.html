<div id="app"></div>

<script>
/* ===== ENGINE (pure functions, no DOM) ===== */
const RULES = { rolesSec: 10, morningSec: 8, banishSec: 8, voteSec: 60, minPlayers: 4 };
const Engine = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));
  const botCount = n => Math.max(1, Math.floor(n / 4));
  const living = g => g.order.filter(id => g.alive[id]);
  const livingBy = (g, role) => living(g).filter(id => g.roles[id] === role);
  const act = (P, id, g) => { const a = P[id] && P[id].act; return a && a.phaseId === g.phaseId ? a : null; };
  const ghostOf = (P, id) => (P[id] && P[id].ghost) || {};
  const go = (g, phase, sec, now) => { g.phase = phase; g.phaseId += 1; g.phaseEndsAt = sec ? now + sec * 1000 : 0; return g; };

  function newGame(code, hostId) {
    return { code, hostId, mode: 'adult', nightSec: 45, failDeath: true, taskNeed: 4,
      phase: 'lobby', phaseId: 1, phaseEndsAt: 0, gameNo: 1, night: 0, vote: 0,
      order: [], names: {}, roles: {}, alive: {}, deaths: [], event: null, winner: null,
      credits: {}, ghostHits: {}, votes: {}, lastScores: {}, scores: {}, created: Date.now() };
  }
  const readyIds = (g, P) => Object.keys(P).filter(id => P[id] && P[id].nickname && P[id].ready === g.gameNo);
  const hostReady = (g, P) => !!(P[g.hostId] && P[g.hostId].ready === g.gameNo);
  const canStart = (g, P) => g.phase === 'lobby' && hostReady(g, P) && readyIds(g, P).length >= RULES.minPlayers;

  function start(g0, P, now, rnd = Math.random) {
    if (!canStart(g0, P)) return null;
    const g = clone(g0);
    const ids = readyIds(g, P);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    const k = botCount(ids.length);
    g.roles = {}; g.alive = {}; g.names = {};
    ids.forEach((id, i) => { g.roles[id] = i < k ? 'bot' : 'bobby'; g.alive[id] = true; g.names[id] = P[id].nickname; });
    // Solo test: the host can force their own role; swap with someone on the other side
    const want = g.testRole, me = g.hostId;
    if ((want === 'bot' || want === 'bobby') && g.roles[me] && g.roles[me] !== want) {
      const other = ids.find(id => id !== me && g.roles[id] === want);
      if (other) { g.roles[other] = g.roles[me]; g.roles[me] = want; }
    }
    g.order = ids.slice().sort((a, b) => g.names[a].localeCompare(g.names[b]));
    Object.assign(g, { night: 0, vote: 0, deaths: [], event: null, winner: null, credits: {}, ghostHits: {}, votes: {}, lastScores: {} });
    return go(g, 'roles', RULES.rolesSec, now);
  }
  const startNight = (g0, now) => { const g = clone(g0); g.night += 1; g.event = null; return go(g, 'night', g.nightSec, now); };
  const startVote = (g0, now) => { const g = clone(g0); g.vote += 1; g.votes = {}; return go(g, 'vote', RULES.voteSec, now); };

  function kill(g, id, cause) { g.alive[id] = false; g.deaths.push({ id, cause, night: g.night, vote: g.vote }); }
  function winnerOf(g) {
    if (livingBy(g, 'bot').length === 0) return 'bobbies';
    if (livingBy(g, 'bobby').length === 0) return 'bots';
    return null;
  }
  function resolveNight(g, P) {
    const bots = livingBy(g, 'bot');
    const picks = bots.map(id => (act(P, id, g) || {}).pick);
    let victim = null;
    if (picks.length && picks.every(p => p && p === picks[0]) && g.alive[picks[0]] && g.roles[picks[0]] === 'bobby') victim = picks[0];
    const failed = [];
    if (g.failDeath) {
      livingBy(g, 'bobby').forEach(id => {
        if (id === victim) return;
        const a = act(P, id, g);
        if (!a || (a.hits || 0) < taskNeedFor(id + ':' + g.night, g.nightSec)) failed.push(id);
      });
    }
    // Ghost calls for this night, made by players who were already ghosts
    if (victim) Object.keys(g.names).forEach(id => {
      if (g.alive[id]) return;
      if (ghostOf(P, id).callNight && ghostOf(P, id).callNight[g.night] === victim) g.ghostHits[id] = (g.ghostHits[id] || 0) + 1;
    });
    if (victim) kill(g, victim, 'eliminated');
    failed.forEach(id => kill(g, id, 'failed'));
    g.event = { type: 'morning', victim, failed, night: g.night };
  }
  function resolveVote(g, P) {
    const voters = living(g);
    const votes = {};
    voters.forEach(id => { const a = act(P, id, g); if (a && a.vote && g.alive[a.vote] && a.vote !== id) votes[id] = a.vote; });
    const count = {};
    Object.values(votes).forEach(t => { count[t] = (count[t] || 0) + 1; });
    const max = Math.max(0, ...Object.values(count));
    const top = Object.keys(count).filter(t => count[t] === max);
    let banished = null;
    if (max > 0 && top.length === 1) banished = top[0];
    if (banished) {
      if (g.roles[banished] === 'bot') Object.keys(votes).forEach(v => { if (votes[v] === banished && g.roles[v] === 'bobby') g.credits[v] = (g.credits[v] || 0) + 1; });
      Object.keys(g.names).forEach(id => {
        if (g.alive[id]) return;
        if (ghostOf(P, id).callVote && ghostOf(P, id).callVote[g.vote] === banished) g.ghostHits[id] = (g.ghostHits[id] || 0) + 1;
      });
      kill(g, banished, 'banished');
    }
    g.votes = votes;
    g.event = { type: 'banish', banished, role: banished ? g.roles[banished] : null, tie: max > 0 && top.length > 1, count };
  }
  function score(g, P) {
    const out = {};
    const deathOf = id => g.deaths.find(d => d.id === id);
    g.order.forEach(id => {
      const role = g.roles[id], won = (g.winner === 'bots') === (role === 'bot');
      const parts = [];
      if (won) parts.push(['Team win', 3]);
      if (won && g.alive[id]) parts.push(['Survived', 1]);
      if (role === 'bot' && !g.deaths.some(d => d.id === id && d.cause === 'banished')) parts.push(['Never caught', 2]);
      if (g.credits[id]) parts.push(['Voted out a Bot', g.credits[id]]);
      const d = deathOf(id);
      if (d) {
        const gh = ghostOf(P, id);
        if (gh.side && gh.side === g.winner) parts.push(['Ghost backed the winner', gh.sideAt === d.night ? 2 : 1]);
        const unmasked = (gh.unmask || []).filter(x => g.roles[x] === 'bot').length;
        if (unmasked) parts.push(['Ghost unmasked Bots', unmasked]);
        if (g.ghostHits[id]) parts.push(['Ghost called it', g.ghostHits[id]]);
      }
      out[id] = { total: parts.reduce((s, p) => s + p[1], 0), parts };
    });
    return out;
  }
  function finish(g, P, now) {
    g.lastScores = score(g, P);
    const s = g.scores;
    g.order.forEach(id => {
      const prev = s[id] || { name: g.names[id], total: 0, games: 0 };
      s[id] = { name: g.names[id], total: prev.total + g.lastScores[id].total, games: prev.games + 1, last: g.lastScores[id].total };
    });
    return go(g, 'over', 0, now);
  }
  function advance(g0, P, now) {
    if (!g0) return null;
    const ends = g0.phaseEndsAt && now >= g0.phaseEndsAt;
    if (g0.phase === 'roles' && ends) return go(clone(g0), 'discussion', 0, now);
    if (g0.phase === 'night' && ends) { const g = clone(g0); resolveNight(g, P); return go(g, 'morning', RULES.morningSec, now); }
    if (g0.phase === 'morning' && ends) { const g = clone(g0); g.winner = winnerOf(g); return g.winner ? finish(g, P, now) : go(g, 'discussion', 0, now); }
    if (g0.phase === 'vote') {
      const all = living(g0).every(id => { const a = act(P, id, g0); return a && a.vote; });
      if (all || ends) { const g = clone(g0); resolveVote(g, P); return go(g, 'banish', RULES.banishSec, now); }
    }
    if (g0.phase === 'banish' && ends) { const g = clone(g0); g.winner = winnerOf(g); if (g.winner) return finish(g, P, now); g.night += 1; g.event = null; return go(g, 'night', g.nightSec, now); }
    return null;
  }
  function nextGame(g0, now) {
    const g = clone(g0); g.gameNo += 1;
    Object.assign(g, { order: [], roles: {}, alive: {}, deaths: [], event: null, winner: null, night: 0, vote: 0, votes: {}, credits: {}, ghostHits: {}, lastScores: {} });
    return go(g, 'lobby', 0, now);
  }
  const endDinner = (g0, now) => go(clone(g0), 'podium', 0, now);
  // Decoy marker: deterministic per player, night and time slot
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  const markerIndex = (seed, slot, n) => n ? hash(seed + ':' + slot) % n : -1;
  // Each marker stop lasts a random 3-10 s, the same on the player's phone and in the host's check
  function decoyStops(seed, nightSec) { const out = []; let t = 0, i = 0; while (t < nightSec * 1000) { out.push(t); t += 3000 + hash(seed + '#' + i) % 7001; i++; } return out; }
  function slotAt(seed, nightSec, elapsedMs) { const st = decoyStops(seed, nightSec); let k = 0; st.forEach((t, i) => { if (elapsedMs >= t) k = i; }); return k; }
  const taskNeedFor = (seed, nightSec) => Math.max(1, Math.ceil(decoyStops(seed, nightSec).length * 0.6));
  return { newGame, canStart, readyIds, start, startNight, startVote, advance, nextGame, endDinner, living, livingBy, act, botCount, markerIndex, slotAt, taskNeedFor, hostReady, score };
})();
/* ===== END ENGINE ===== */
</script>

<script>
/* ===== STORES ===== */
const clean = s => String(s).replace(/[^A-Za-z0-9_\-~:@+]/g, '_').slice(0, 120) || 'x';
class LocalStore {
  constructor() { this.game = null; this.players = {}; this.subs = []; this.local = true; }
  watch(cb) { this.subs.push(cb); cb(this.snap()); }
  snap() { return { game: this.game, players: this.players }; }
  emit() { const s = this.snap(); this.subs.forEach(f => f(s)); }
  async setGame(g) { this.game = g; setTimeout(() => this.emit(), 0); }
  async setPlayer(id, doc) { this.players = { ...this.players, [id]: doc }; setTimeout(() => this.emit(), 0); }
  stop() { this.subs = []; }
}
class DbStore {
  constructor(db, code) {
    this.db = db; this.code = code; this.game = undefined; this.players = {}; this.subs = []; this.pending = {}; this.chains = {};
    this.u1 = db.doc(`games/${code}`).onSnapshot(s => { this.game = s.exists ? s.data() : null; this.emit(); }, e => this.fail(e));
    this.u2 = db.collection(`games/${code}/players`).onSnapshot(q => { const p = {}; q.docs.forEach(d => { p[d.id] = d.data(); }); this.players = p; this.emit(); }, e => this.fail(e));
  }
  watch(cb) { this.subs.push(cb); if (this.game !== undefined) cb(this.snap()); }
  snap() { return { game: this.game, players: this.players }; }
  emit() { if (this.game === undefined) return; const s = this.snap(); this.subs.forEach(f => f(s)); }
  fail(e) { App.flash(e && e.code === 'revoked' ? 'Your access to this game ended.' : 'Lost the live connection. Reload the page to rejoin.'); }
  write(path, data) {
    this.pending[path] = data;
    if (this.chains[path]) return this.chains[path];
    this.chains[path] = (async () => {
      while (this.pending[path]) {
        const d = this.pending[path]; this.pending[path] = null;
        try { await this.db.doc(path).set(d); }
        catch (e) {
          if (e && e.code === 'invalid_argument') App.flash('You can view this game but not play: ask the owner to share it with you as an Editor.');
          else if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); if (!this.pending[path]) this.pending[path] = d; }
          else App.flash('Could not save: ' + ((e && e.message) || 'unknown error'));
        }
      }
      this.chains[path] = null;
    })();
    return this.chains[path];
  }
  setGame(g) { return this.write(`games/${this.code}`, g); }
  setPlayer(id, doc) { return this.write(`games/${this.code}/players/${id}`, doc); }
  stop() { try { this.u1(); this.u2(); } catch (e) {} this.subs = []; }
}

/* ===== WORDS PER MODE ===== */
const WORDS = {
  adult: {
    bot: 'Bot', bots: 'Bots', bobby: 'Bobby', bobbies: 'Bobbies',
    botBlurb: 'You are a rogue machine hiding among the humans. Each night, agree with the other Bots on one Bobby to terminate.',
    bobbyBlurb: 'You are human. Find the Bots and vote them out before they take over.',
    nightTitle: 'Night falls', nightBot: 'Tap a name to target it. When every Bot taps the same name, it locks.',
    nightBobby: 'Keep the signal: tap the name with the marker before it moves.',
    deadTitle: 'You have been deleted', deadSub: 'Stay quiet. You are a Ghost now: keep playing the side game.',
    victim: n => `${n} was found terminated`, failed: n => `${n} suffered a system failure`, noVictim: 'Nobody was terminated tonight.',
    wasBot: n => `${n} was a Bot`, wasBobby: n => `${n} was a Bobby`,
    botsWin: 'The Bots took over', bobbiesWin: 'Humanity survives',
  },
  kids: {
    bot: 'Bot', bots: 'Bots', bobby: 'Bobby', bobbies: 'Bobbies',
    botBlurb: 'You are a sneaky robot! Each night, team up with the other Bots to unplug one Bobby.',
    bobbyBlurb: 'You are a human! Spot the robots and vote them out.',
    nightTitle: 'Bedtime in the village', nightBot: 'Tap a name. When all Bots tap the same name, it locks.',
    nightBobby: 'Catch the blinking dot: tap the name it sits on before it jumps.',
    deadTitle: "You've been unplugged!", deadSub: 'Shh, no clues! You are a Ghost now: play the guessing game.',
    victim: n => `${n} ran out of battery`, failed: n => `${n} tripped over a cable`, noVictim: 'Everyone woke up with full batteries.',

/* ===== SOUND ===== */
const Sound = (() => {
  let ctx = null;
  const unlock = () => { try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) {} };
  function tone(type, f0, f1, dur, gain, t0 = 0) {
    if (!ctx) return;
    const t = ctx.currentTime + t0, o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(gain, t + 0.05); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    unlock,
    death(mode) {
      unlock();
      if (mode === 'kids') { tone('sine', 660, 330, .35, .25); tone('sine', 440, 110, .8, .25, .3); return; }
      tone('sawtooth', 220, 40, 2.6, .18); tone('sawtooth', 227, 37, 2.6, .12); tone('square', 880, 55, 1.4, .05, .2);
      try { navigator.vibrate && navigator.vibrate([300, 100, 600]); } catch (e) {}
    },
    tap() { if (ctx) tone('triangle', 520, 480, .06, .05); try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} },
    chime() { if (ctx) { tone('sine', 523, 523, .25, .12); tone('sine', 784, 784, .35, .1, .15); } },
  };
})();

/* ===== SIMULATED PLAYERS (solo test) ===== */
const SIM_NAMES = ['Ada', 'Bruno', 'Cleo', 'Dex', 'Elin', 'Farah', 'Gus', 'Hana', 'Ivo'];
function simTick(store, g, P, now) {
  if (!g) return;
  Object.keys(P).filter(id => P[id].sim).forEach(id => {
    const p = P[id], role = g.roles[id], alive = g.alive[id];
    let next = null;
    const rnd = Engine.markerIndex(id, g.phaseId, 1000) / 1000; // stable per phase
    if (g.phase === 'lobby' && p.ready !== g.gameNo) next = { ...p, ready: g.gameNo };
    if (!alive || !g.order.includes(id)) {
      if (g.phase !== 'lobby' && g.order.includes(id) && !(p.ghost && p.ghost.side)) next = { ...p, ghost: { side: rnd < .5 ? 'bots' : 'bobbies', sideAt: g.night, unmask: [], callVote: {}, callNight: {} } };
      if (next) store.setPlayer(id, next);
      return;
    }
    const a = p.act && p.act.phaseId === g.phaseId ? p.act : null;
    const elapsed = now - (g.phaseEndsAt - g.nightSec * 1000);
    if (g.phase === 'night' && elapsed > 4000 + rnd * 6000) {
      if (role === 'bot') {
        const humanBot = Object.keys(P).find(x => !P[x].sim && g.roles[x] === 'bot' && g.alive[x]);
        const hp = humanBot && P[humanBot].act && P[humanBot].act.phaseId === g.phaseId ? P[humanBot].act.pick : null;
        const targets = Engine.livingBy(g, 'bobby');
        const pick = hp || targets[Engine.markerIndex('night' + g.night, 0, targets.length)];
        if (!a || a.pick !== pick) next = { ...p, act: { phaseId: g.phaseId, pick } };
      } else if (!a) next = { ...p, act: { phaseId: g.phaseId, hits: Engine.taskNeedFor(id + ':' + g.night, g.nightSec) } };
    }
    if (g.phase === 'vote' && !a && now > g.phaseEndsAt - (RULES.voteSec - 3 - rnd * 8) * 1000) {
      const others = Engine.living(g).filter(x => x !== id && (role !== 'bot' || g.roles[x] !== 'bot'));
      next = { ...p, act: { phaseId: g.phaseId, vote: others[Engine.markerIndex(id + g.vote, 1, others.length)] } };
    }
    if (next) store.setPlayer(id, next);
  });
}

/* ===== APP ===== */

  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

    pick(id) { Sound.tap(); saveMe({ act: { phaseId: S.game.phaseId, pick: id } }); },
    decoy(idx) {
      const g = S.game, slot = S.slotSeen, a = myAct() || { phaseId: g.phaseId, hits: 0, misses: 0 };
      const key = g.phaseId + ':' + slot;
      const targets = nightList();

    const ev = g.event;
    const recap = ev && ev.type === 'banish' ? '' : '';
    return `${topBar(first ? 'Day 1: first discussion' : `Day ${g.night}: discussion`)}${flashBox()}
    <div class="card hero"><span class="big">${first ? 'Who seems off?' : 'Talk it through'}</span>
      <p class="muted">${first ? 'Introduce yourselves and look for anyone acting a little robotic.' : 'Discuss who might be a Bot. When you are ready, the host opens the vote.'}</p></div>
    ${recap}
    ${!alive() && inGame() ? ghostPanel() : ''}
    <div class="card"><span class="label">Players</span>${peopleList()}</div>
    ${amHost() ? `<button class="${first ? 'danger' : 'primary'} wide" data-a="${first ? 'night' : 'vote'}">${first ? 'Night falls' : 'Open the vote'}</button>` : ''}`;
  }

  function viewNight() {
    const g = S.game;
    if (!inGame() || !alive()) return `${topBar(W().nightTitle)}<div class="card hero"><span class="big">${W().nightTitle}</span><p class="muted">Ghosts stay quiet while the living tap away.</p></div>${inGame() ? ghostPanel() : ''}`;
    const list = nightList(), r = myRole(), a = myAct() || {};
    let rows, status;
    if (r === 'bot') {
      const bots = Engine.livingBy(g, 'bot');
      const picks = {}; bots.forEach(b => { const pa = b === S.myId ? myAct() : Engine.act(S.players, b, g); if (pa && pa.pick) (picks[pa.pick] = picks[pa.pick] || []).push(b); });
      const lockedOn = Object.keys(picks).find(t => picks[t].length === bots.length);
      const agreed = lockedOn ? bots.length : Math.max(0, ...Object.values(picks).map(x => x.length));
      rows = list.map(id => {
        const ally = g.roles[id] === 'bot';
        return `<button class="item ${a.pick === id ? 'done' : picks[id] ? 'target' : ''} ${lockedOn === id ? 'locked' : ''}" data-a="pick" data-v="${esc(id)}" ${ally ? 'disabled' : ''}>
          <span>${esc(name(id))}</span><span class="dots">${(picks[id] || []).map(b => `<i class="dot ${b === S.myId ? 'me' : ''}"></i>`).join('')}</span></button>`;
      }).join('');
      status = `${lockedOn ? 'Locked' : 'Agreement'} ${agreed}/${bots.length}`;
    } else {
      const slot = S.slotSeen, m = Engine.markerIndex(S.myId + ':' + g.night, slot, list.length);
      const hit = !!S.hits[g.phaseId + ':' + slot];
      rows = list.map((id, i) => `<button class="item ${i === m ? (hit ? 'done' : 'target') : ''}" data-a="decoy" data-v="${i}"><span>${esc(name(id))}</span><span class="dots">${i === m ? '<i class="dot me"></i>' : ''}</span></button>`).join('');
      const need = Engine.taskNeedFor(S.myId + ':' + g.night, g.nightSec);
      status = `Signal ${Math.min(a.hits || 0, need)}/${need}`;
    }
    return `${topBar(W().nightTitle)}
    <div class="card"><div class="row" style="justify-content:space-between"><h2>${W().nightTitle}</h2><span class="pill mono">${status}</span></div>
      <p class="small muted">${r === 'bot' ? W().nightBot : W().nightBobby}</p>
      <div class="list">${rows}</div></div>
    <p class="small muted">Keep tapping until the timer ends. Everyone's screen looks the same.</p>`;
  }

  function viewMorning() {
    const g = S.game, ev = g.event || {}, w = W();
    const lines = [];
    if (ev.victim) lines.push(w.victim(esc(name(ev.victim))));
    (ev.failed || []).forEach(id => lines.push(w.failed(esc(name(id)))));
    if (!lines.length) lines.push(w.noVictim);
    return `${topBar(`Morning of day ${g.night + 1}`)}
    <div class="card hero"><span class="label">Morning</span>${lines.map(l => `<span class="big">${l}</span>`).join('')}</div>
    <div class="card"><span class="label">Players</span>${peopleList()}</div>`;
  }

  function viewVote() {
    const g = S.game, a = myAct() || {}, canVote = inGame() && alive();
    const live = Engine.living(g);
    const votesFor = {}; live.forEach(v => { const va = v === S.myId ? myAct() : Engine.act(S.players, v, g); if (va && va.vote) (votesFor[va.vote] = votesFor[va.vote] || []).push(v); });
    const voted = Object.values(votesFor).flat().length;
    return `${topBar(`Day ${g.night}: vote`)}${flashBox()}
    <div class="card"><div class="row" style="justify-content:space-between"><h2>Who is a Bot?</h2><span class="pill mono">${voted}/${live.length} voted</span></div>
      <p class="small muted">Voting is open: everyone sees who voted for whom. You can change your vote until it closes.</p>
      <div class="list">${live.map(id => `<button class="item ${a.vote === id ? 'sel' : ''}" data-a="castVote" data-v="${esc(id)}" ${!canVote || id === S.myId ? 'disabled' : ''}>
        <span class="stack" style="gap:2px"><span>${esc(name(id))}${id === S.myId ? ' <span class="muted small">(you)</span>' : ''}</span>
        ${votesFor[id] ? `<span class="tally">← ${votesFor[id].map(v => esc(name(v))).join(', ')}</span>` : ''}</span>
        <span class="mono">${votesFor[id] ? votesFor[id].length : ''}</span></button>`).join('')}</div></div>
    ${!canVote && inGame() ? ghostPanel() : ''}`;
  }

  function viewBanish() {
    const g = S.game, ev = g.event || {}, w = W();
    let body;
    if (ev.banished) body = `<span class="label">Banished</span><span class="big" style="color:var(--${ev.role === 'bot' ? 'bot' : 'bobby'})">${ev.role === 'bot' ? w.wasBot(esc(name(ev.banished))) : w.wasBobby(esc(name(ev.banished)))}</span>`;
    else body = `<span class="label">No banishment</span><span class="big">${ev.tie ? 'A tie. Nobody leaves.' : 'Nobody got a vote.'}</span>`;
    return `${topBar('The vote is in')}<div class="card hero">${body}</div>
    <div class="card"><span class="label">How people voted</span><div class="list">${Object.keys(g.votes || {}).map(v => `<div class="item"><span>${esc(name(v))}</span><span class="muted">→ ${esc(name(g.votes[v]))}</span></div>`).join('') || '<p class="small muted">No votes were cast.</p>'}</div></div>`;
  }

  function ghostPanel() {
    const g = S.game, gh = ghost(), living = Engine.living(g);
    const nn = nextNight(), nv = nextVote();
    const canNight = g.phase !== 'night', canVote = g.phase === 'discussion' || g.phase === 'vote';
    return `<div class="card"><div class="row" style="justify-content:space-between"><span class="label">Ghost side game</span><span class="pill">Ghost</span></div>
      <p class="small muted">Your guesses stay secret until the end and earn session points. Keep a straight face.</p>
      <span class="small"><b>Back a side</b> (worth more if picked in the round you died)</span>
      <div class="toggle"><button data-a="gSide" data-v="bobbies" aria-pressed="${gh.side === 'bobbies'}">${W().bobbies}</button><button data-a="gSide" data-v="bots" aria-pressed="${gh.side === 'bots'}">${W().bots}</button></div>
      <span class="small"><b>Unmask the Bots</b>: tap everyone you think is a Bot</span>
      <div class="row" style="gap:6px">${living.map(id => `<button data-a="gUnmask" data-v="${esc(id)}" aria-pressed="${(gh.unmask || []).includes(id)}" style="min-height:40px;padding:8px 12px" class="${(gh.unmask || []).includes(id) ? 'danger' : ''}">${esc(name(id))}</button>`).join('')}</div>
      ${canNight ? `<label class="small" for="gn"><b>Call night ${nn}</b>: who will the Bots take?</label>
      <select id="gn" data-ch="gCallNight"><option value="">No guess</option>${Engine.livingBy(g, 'bobby').concat(Engine.livingBy(g, 'bot')).sort().map(id => `<option value="${esc(id)}" ${(gh.callNight || {})[nn] === id ? 'selected' : ''}>${esc(name(id))}</option>`).join('')}</select>` : ''}
      ${canVote ? `<label class="small" for="gv"><b>Call vote ${nv}</b>: who will be banished?</label>
      <select id="gv" data-ch="gCallVote"><option value="">No guess</option>${living.map(id => `<option value="${esc(id)}" ${(gh.callVote || {})[nv] === id ? 'selected' : ''}>${esc(name(id))}</option>`).join('')}</select>` : ''}
    </div>`;
  }

  function sessionTable(highlightLast) {
    const sc = S.game.scores || {}, ids = Object.keys(sc).sort((a, b) => sc[b].total - sc[a].total);
    if (!ids.length) return '';
    return `<div class="card"><span class="label">Dinner leaderboard</span><table><thead><tr><th>#</th><th>Player</th>${highlightLast ? '<th class="num">This game</th>' : ''}<th class="num">Total</th></tr></thead>
      <tbody>${ids.map((id, i) => `<tr><td class="mono">${i + 1}</td><td>${esc(sc[id].name)}${id === S.myId ? ' <span class="muted small">(you)</span>' : ''}</td>${highlightLast ? `<td class="num mono">${S.game.lastScores[id] ? '+' + S.game.lastScores[id].total : '–'}</td>` : ''}<td class="num mono"><b>${sc[id].total}</b></td></tr>`).join('')}</tbody></table></div>`;
  }

  function viewOver() {
    const g = S.game, w = W(), mine = g.lastScores[S.myId];
    const recap = g.order.filter(id => !g.alive[id]).map(id => {
      const p = S.players[id] || {}, gh = p.ghost || {};
      const bits = [];
      if (gh.side) bits.push(`backed the ${gh.side === 'bots' ? w.bots : w.bobbies}`);
      const correct = (gh.unmask || []).filter(x => g.roles[x] === 'bot');
      if (correct.length) bits.push(`unmasked ${correct.map(x => esc(name(x))).join(', ')}`);
      if (g.ghostHits[id]) bits.push(`called ${g.ghostHits[id]} event${g.ghostHits[id] > 1 ? 's' : ''} right`);
      return bits.length ? `<li><b>${esc(name(id))}</b> ${bits.join(', ')}</li>` : '';
    }).join('');
    return `${topBar('Game over')}
    <div class="card hero"><span class="label">Game ${g.gameNo}</span><span class="big" style="color:var(--${g.winner === 'bots' ? 'bot' : 'bobby'})">${g.winner === 'bots' ? w.botsWin : w.bobbiesWin}</span>
      ${mine ? `<p>You scored <b>${mine.total}</b>${mine.parts.length ? ': ' + mine.parts.map(p => `${esc(p[0])} +${p[1]}`).join(', ') : ''}</p>` : ''}</div>
    <div class="card"><span class="label">Everyone's role</span>${peopleList(id => `<span class="mono small">+${g.lastScores[id] ? g.lastScores[id].total : 0}</span>`)}</div>
    ${recap ? `<div class="card"><span class="label">Ghost recap</span><ul style="margin:0;padding-left:20px">${recap}</ul></div>` : ''}
    ${sessionTable(true)}
    ${amHost() ? (S.confirmEnd ? `<div class="card"><p>End the dinner and show the podium?</p><div class="row"><button class="danger" data-a="endDinner">End dinner</button><button data-a="cancelEnd">Keep playing</button></div></div>`
      : `<div class="row"><button class="primary" style="flex:1" data-a="nextGame">Next game</button><button style="flex:1" data-a="endDinner">End dinner</button></div>`) : '<p class="small muted">The host starts the next game.</p>'}`;
  }

  function viewPodium() {
    const sc = S.game.scores || {}, ids = Object.keys(sc).sort((a, b) => sc[b].total - sc[a].total);
    const step = (i, cls) => ids[i] ? `<div class="step ${cls}"><span class="display" style="font-size:1.6rem">${i + 1}</span><b>${esc(sc[ids[i]].name)}</b><span class="mono small">${sc[ids[i]].total} pts</span></div>` : '<div></div>';
    return `${logo()}<div class="card hero"><span class="label">End of dinner · ${S.game.gameNo} game${S.game.gameNo > 1 ? 's' : ''}</span><span class="big">The podium</span></div>
    <div class="podium">${step(1, 'p2')}${step(0, 'p1')}${step(2, 'p3')}</div>
    ${sessionTable()}
    <button class="ghostbtn" data-a="leave">Back to start</button>`;
  }

  function spectator() {
    return `${topBar('In progress')}<div class="card hero"><span class="big">A game is running</span><p class="muted">You joined after it started. You'll be in the next game: get ready in the lobby when it opens.</p></div>`;
  }

  function deadOverlay() {
    return `<div class="dead-screen" role="alertdialog" aria-live="assertive"><span class="big">${W().deadTitle}</span><p>${W().deadSub}</p><button data-a="closeDead" style="background:transparent;color:inherit;border-color:currentColor">Become a Ghost</button></div>`;
  }

  let lastHtml = '';
  function render() {
    let html;
    if (S.screen !== 'game' || !S.game) html = viewHome();
    else {
      const p = S.game.phase;
      if (p !== 'lobby' && p !== 'podium' && !inGame()) html = spectator();
      else html = ({ lobby: viewLobby, roles: viewRoles, discussion: viewDiscussion, night: viewNight, morning: viewMorning, vote: viewVote, banish: viewBanish, over: viewOver, podium: viewPodium })[p]();
      if (S.store && S.store.local && p !== 'lobby' && p !== 'podium') html += `<button class="ghostbtn small" data-a="peek">${S.peek ? 'Hide' : 'Show'} all roles (test only)</button><button class="ghostbtn small" data-a="leave">Quit test</button>`;
      if (S.deadOverlay) html += deadOverlay();
    }
    const focus = document.activeElement && document.activeElement.id, sel = focus && document.activeElement.selectionStart;
    if (html === lastHtml) return;
    lastHtml = html;
    $app.innerHTML = html;
    if (focus) { const el = document.getElementById(focus); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) {} } }
  }
  return { boot, flash, render, S };
})();
document.body.dataset.mode = 'adult';
App.boot();
</script>
</body>
</html>
